<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sashka Messenger v5.0</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --surface3: #282828;
            --text: #e8e8e8; --text2: #999; --accent: #5b9bd5; --accent2: #4a8ac4;
            --green: #4caf84; --red: #e0555a; --orange: #e8a84c; --purple: #9b59b6;
            --border: #2a2a2a; --radius: 12px; --radius-sm: 8px;
            --shadow: 0 2px 20px rgba(0,0,0,0.6);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --sidebar-width: 320px;
        }
        .light {
            --bg: #f5f5f5; --surface: #fff; --surface2: #f0f0f0; --surface3: #e5e5e5;
            --text: #1a1a1a; --text2: #666; --border: #ddd;
            --shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font); background: #000; color: var(--text);
            height: 100vh; height: 100dvh; overflow: hidden; display: flex;
            align-items: center; justify-content: center;
            transition: background 0.3s, color 0.3s; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app { width: 100vw; height: 100vh; display: flex; background: var(--surface); position: relative; }
        .sidebar { width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 5; }
        .sidebar-header { padding: 12px; border-bottom: 1px solid var(--border); background: var(--surface2); }
        .sidebar-header h2 { font-size: 1.1rem; margin-bottom: 8px; }
        .search-box { width: 100%; padding: 8px 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface3); color: var(--text); outline: none; font-size: 0.85rem; }
        .search-box:focus { border-color: var(--accent); }
        .chat-tabs { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--surface2); overflow-x: auto; flex-shrink: 0; }
        .chat-tab { padding: 5px 10px; border-radius: 14px; border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        .chat-tab.active { background: var(--accent); color: #fff; }
        .chat-list { flex: 1; overflow-y: auto; padding: 4px 6px; }
        .chat-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; margin-bottom: 1px; }
        .chat-item:hover { background: var(--surface2); }
        .chat-item.active { background: var(--accent); color: #fff; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; background: var(--surface3); background-size: cover; background-position: center; overflow: hidden; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 600; font-size: 0.85rem; }
        .chat-preview { font-size: 0.7rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 8px; font-size: 0.6rem; font-weight: 700; margin-left: 3px; }
        .badge.creator { background: var(--purple); color: #fff; }
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
        .main-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: var(--surface); flex-shrink: 0; }
        .back-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 1rem; display: none; align-items: center; justify-content: center; }
        .main-header-info { flex: 1; min-width: 0; }
        .main-header-info .name { font-weight: 700; font-size: 0.9rem; }
        .messages-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.85rem; line-height: 1.3; animation: msgIn 0.2s ease-out; word-break: break-word; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.sent { align-self: flex-end; background: var(--accent); color: #fff; }
        .msg.received { align-self: flex-start; background: var(--surface2); }
        .msg.system { align-self: center; background: var(--surface3); color: var(--text2); font-size: 0.7rem; max-width: 90%; text-align: center; border-radius: 10px; padding: 5px 10px; }
        .msg .msg-sender { font-weight: 700; font-size: 0.7rem; margin-bottom: 2px; }
        .msg img.msg-image { max-width: 200px; border-radius: 8px; margin-top: 4px; cursor: pointer; }
        .msg video.msg-video-circle { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; margin-top: 4px; cursor: pointer; background: #000; }
        .msg a.msg-file { display: inline-block; padding: 8px 12px; background: var(--surface3); border-radius: 8px; color: var(--accent); text-decoration: none; margin-top: 4px; }
        .input-area { padding: 8px 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; background: var(--surface); flex-shrink: 0; }
        .input-area textarea { flex: 1; resize: none; border-radius: 18px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); padding: 8px 12px; font-size: 0.85rem; outline: none; max-height: 80px; font-family: var(--font); }
        .send-btn, .reload-btn, .refresh-btn { width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .send-btn { background: var(--accent); color: #fff; }
        .reload-btn { background: var(--surface2); color: var(--text); }
        .refresh-btn { background: var(--surface2); color: var(--text); }
        .icon-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal { background: var(--surface); border-radius: var(--radius); padding: 20px; width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow); }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.85rem; margin-bottom: 8px; outline: none; font-family: var(--font); }
        .btn { padding: 8px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; background: var(--accent); color: #fff; }
        .btn.ghost { background: var(--surface2); color: var(--text); }
        .btn.danger { background: var(--red); }
        .hidden { display: none !important; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 16px; font-size: 0.8rem; z-index: 200; }
        .call-overlay { position: fixed; inset: 0; background: #0a0a0a; z-index: 150; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; }
        .call-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .call-btn { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .call-btn.decline { background: #e74c3c; color: #fff; }
        .call-btn.mute { background: #444; color: #fff; }
        .call-btn.mute.active { background: #e8a84c; }
        @media (max-width: 768px) {
            :root { --sidebar-width: 100%; }
            .sidebar { position: fixed; left: -100%; top: 0; bottom: 0; width: 100%; z-index: 10; }
            .sidebar.open { left: 0; }
            .back-btn { display: flex; }
            .msg { max-width: 90%; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h2>💬 Sashka Messenger</h2><input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск..."></div>
        <div class="chat-tabs" id="chatTabs">
            <button class="chat-tab active" data-filter="all">Все</button><button class="chat-tab" data-filter="private">Личные</button><button class="chat-tab" data-filter="group">Группы</button><button class="chat-tab" data-filter="channel">Каналы</button><button class="chat-tab" data-filter="system">Системные</button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div style="padding:6px;border-top:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;">
            <button class="icon-btn" id="btnNewChat">➕</button><button class="icon-btn" id="btnDiscover">🔍</button><button class="icon-btn" id="btnProfile">👤</button><button class="icon-btn" id="btnAdmin" style="display:none;">⚙️</button><button class="icon-btn" id="btnNews">📰</button><button class="icon-btn" id="btnTheme">🌓</button><button class="icon-btn" id="btnRefreshApp" title="Обновить мессенджер">🔄</button>
        </div>
    </div>
    <div class="main" id="mainPanel">
        <div class="main-header">
            <button class="back-btn" id="btnBack">←</button>
            <div class="chat-avatar" id="mainAvatar" style="width:36px;height:36px;font-size:0.9rem;">💬</div>
            <div class="main-header-info"><div class="name" id="mainName">Выберите чат</div></div>
            <div style="display:flex;gap:4px;">
                <button class="icon-btn" id="btnCall" style="display:none;">📞</button><button class="icon-btn" id="btnAttach">📎</button><button class="icon-btn" id="btnVideoCircle">📹</button>
            </div>
        </div>
        <div class="messages-area" id="messagesArea"><div style="text-align:center;color:var(--text2);margin-top:40px;">💬<br>Выберите чат</div></div>
        <div class="input-area" id="inputArea" style="display:none;">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button class="send-btn" id="btnSend">➤</button>
            <button class="reload-btn" id="btnReload" title="Обновить чат">🔄</button>
        </div>
    </div>
</div>

<div class="modal-overlay hidden" id="loginModal"><div class="modal"><h3>🔐 Вход</h3><input type="text" id="loginName" placeholder="Логин"><input type="password" id="loginPass" placeholder="Пароль"><input type="text" id="loginDesc" placeholder="Описание"><button class="btn" id="btnLogin">Войти</button></div></div>
<div class="modal-overlay hidden" id="createChatModal"><div class="modal" id="createChatContent"></div></div>
<div class="modal-overlay hidden" id="profileModal"><div class="modal" id="profileContent"></div></div>
<div class="modal-overlay hidden" id="adminModal"><div class="modal" id="adminContent"></div></div>
<div class="modal-overlay hidden" id="discoverModal"><div class="modal" id="discoverContent"></div></div>
<div class="modal-overlay hidden" id="newsModal"><div class="modal" id="newsContent"></div></div>
<div class="modal-overlay hidden" id="videoModal"><div class="modal" style="text-align:center;"><h3>🎥 Видеокружок</h3><video id="videoPreview" autoplay muted style="width:200px;height:200px;border-radius:50%;object-fit:cover;background:#000;"></video><button class="btn" id="btnStartVideo">🔴 Запись</button><button class="btn ghost" id="btnCancelVideo">Отмена</button></div></div>
<div class="call-overlay hidden" id="callOverlay"><div style="font-size:1.2rem;" id="callStatus">Звонок...</div><div class="call-controls"><button class="call-btn mute" id="btnToggleMic">🎤</button><button class="call-btn decline" id="btnEndCall">📴</button></div></div>
<input type="file" id="fileInput" accept="*" style="display:none;">
<div class="toast hidden" id="toast"></div>

<script>
(function() {
    const LS = 'sm50_';
    function L(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d;}catch(e){return d;}}
    function S(k,v){localStorage.setItem(LS+k,JSON.stringify(v));}
    async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
    function guid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
    function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
    function gt(ts){return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
    const $=s=>document.querySelector(s);

    let users=L('users',[]);
    let chats=L('chats',[]);
    let allMessages=L('messages',{});
    let currentUser=L('currentUser',null);
    let currentChatId=L('currentChatId',null);
    let theme=L('theme','dark');
    let newsData=L('news',[]);
    let adminGrants=L('adminGrants',{});
    const SYSTEM_CHAT_ID='__system__';
    const ADMIN_NAME='sashka1999in2359';
    const ADMIN_PASS='Master_302';
    let peer=null, connections={};
    let activeTab='all';
    let mediaRecorder=null, videoStream=null;
    let callActive=false, callStream=null, localAudioTrack=null;

    function saveAll(){S('users',users);S('chats',chats);S('messages',allMessages);S('currentUser',currentUser);S('currentChatId',currentChatId);S('theme',theme);S('news',newsData);S('adminGrants',adminGrants);}

    async function initAdmin(){
        const h=await sha256(ADMIN_PASS);
        if(!users.find(u=>u.name===ADMIN_NAME)) users.unshift({id:'admin_0',name:ADMIN_NAME,passwordHash:h,avatar:null,description:'Админ',blocked:false,isAdmin:true,allowDM:false});
        if(!chats.find(c=>c.id===SYSTEM_CHAT_ID)){chats.push({id:SYSTEM_CHAT_ID,type:'system',name:'SashkaMessenger',members:[]});allMessages[SYSTEM_CHAT_ID]=[];}
        if(!chats.find(c=>c.id==='suggest')){chats.push({id:'suggest',type:'suggest',name:'Предложка',members:[]});allMessages['suggest']=[];}
        saveAll();
    }

    function getChatName(c){if(!c)return'';if(c.type==='system')return'SashkaMessenger';if(c.type==='suggest')return'Предложка';if(c.type==='private'){const p=c.members?.find(m=>m!==currentUser?.id);const u=users.find(u=>u.id===p);return u?u.name:'Неизвестный';}return c.name||'Без названия';}
    function getChatEmoji(c){if(!c)return'💬';if(c.type==='system')return'📋';if(c.type==='suggest')return'💡';if(c.type==='group')return'👥';if(c.type==='channel')return'📢';return'💬';}
    function isAdmin(c){return c&&currentUser&&(c.adminIds?.includes(currentUser.id)||c.creatorId===currentUser.id||currentUser.isAdmin);}
    function isCreator(c){return c&&currentUser&&c.creatorId===currentUser.id;}

    function sendMessageP2P(msg){
        if(!currentChatId)return;
        Object.values(connections).forEach(c=>{if(c.open)try{c.send({type:'message',chatId:currentChatId,msg});}catch(e){}});
    }

    function joinRoom(chatId){
        if(!currentUser||!chatId)return;
        if(peer){peer.destroy();peer=null;}connections={};
        const pid='sm50_'+chatId+'_'+currentUser.id;
        try{
            peer=new Peer(pid,{host:'0.peerjs.com',port:443,secure:true,debug:0});
            peer.on('open',()=>setTimeout(()=>{
                const known=JSON.parse(localStorage.getItem(LS+'known')||'{}');
                if(known[chatId]) known[chatId].forEach(p=>{if(!connections[p]&&p!==peer.id) try{const c=peer.connect(p,{reliable:true});c.on('open',()=>{connections[p]=c;});}catch(e){}});
            },1500));
            peer.on('connection',c=>{c.on('open',()=>{connections[c.peer]=c;c.on('data',d=>{if(d.type==='message'&&d.chatId===currentChatId){if(!allMessages[currentChatId])allMessages[currentChatId]=[];if(!allMessages[currentChatId].some(m=>m.id===d.msg.id)){allMessages[currentChatId].push(d.msg);saveAll();renderMessages();renderChatList();}}});});});
        }catch(e){}
    }

    function leaveRoom(){if(peer){peer.destroy();peer=null;}connections={};}

    function renderAll(){renderChatList();renderMessages();if(currentUser){$('#btnAdmin').style.display=(currentUser.isAdmin||adminGrants[currentUser.id])?'flex':'none';}}

    function renderChatList(filter=''){
        const c=$('#chatList');if(!currentUser){c.innerHTML='';return;}
        let my=chats.filter(ch=>ch.type==='system'||ch.type==='suggest'||ch.members?.includes(currentUser.id));
        if(activeTab!=='all')my=my.filter(ch=>ch.type===activeTab);
        if(filter)my=my.filter(ch=>getChatName(ch).toLowerCase().includes(filter.toLowerCase()));
        my.sort((a,b)=>{const ma=allMessages[a.id]||[],mb=allMessages[b.id]||[];return(mb.length?mb[mb.length-1].time:0)-(ma.length?ma[ma.length-1].time:0);});
        c.innerHTML=my.map(ch=>{
            const msgs=allMessages[ch.id]||[],last=msgs[msgs.length-1];
            const prev=last?(last.file?'📎':last.text||''):'Нет сообщений';
            return`<div class="chat-item${ch.id===currentChatId?' active':''}" data-id="${ch.id}"><div class="chat-avatar">${getChatEmoji(ch)}</div><div class="chat-info"><div class="chat-name">${esc(getChatName(ch))}${isCreator(ch)?' <span class="badge creator">Создатель</span>':''}</div><div class="chat-preview">${esc(prev)}</div></div></div>`;
        }).join('');
        c.querySelectorAll('.chat-item').forEach(el=>el.onclick=()=>{const cid=el.dataset.id;if(cid!==currentChatId){leaveRoom();currentChatId=cid;saveAll();joinRoom(cid);renderAll();if(window.innerWidth<=768)$('#sidebar').classList.remove('open');}});
    }

    function renderMessages(){
        const a=$('#messagesArea');
        if(!currentChatId||!currentUser){a.innerHTML='<div style="text-align:center;color:var(--text2);margin-top:40px;">💬<br>Выберите чат</div>';$('#inputArea').style.display='none';$('#mainName').textContent='Выберите чат';return;}
        const chat=chats.find(c=>c.id===currentChatId);if(!chat){currentChatId=null;saveAll();renderAll();return;}
        $('#mainName').textContent=getChatName(chat);$('#inputArea').style.display='flex';
        let msgs=allMessages[currentChatId]||[];
        a.innerHTML=msgs.map(m=>{const cls=m.system?'system':(m.fromId===currentUser.id?'sent':'received');return`<div class="msg ${cls}"><div class="msg-sender">${esc(m.from)}</div><div>${esc(m.text||'')}${m.file?`<br><img src="${m.file}" class="msg-image">`:''}</div><div style="font-size:0.6rem;text-align:right;">${gt(m.time)}</div></div>`;}).join('');
        a.scrollTop=a.scrollHeight;
    }

    function sendMessage(text,file){
        if(!currentChatId||!currentUser)return;
        const msg={id:guid(),from:currentUser.name,fromId:currentUser.id,text:text||'',file:file||null,time:Date.now(),system:false};
        if(!allMessages[currentChatId])allMessages[currentChatId]=[];
        allMessages[currentChatId].push(msg);
        saveAll();renderMessages();renderChatList();
        sendMessageP2P(msg);
    }

    function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500);}

    // Звонки
    async function startCall(){
        if(!currentChatId||callActive)return;
        try{callActive=true;const s=await navigator.mediaDevices.getUserMedia({audio:true});callStream=s;localAudioTrack=s.getAudioTracks()[0];$('#callOverlay').classList.remove('hidden');$('#callStatus').textContent='Звонок...';}catch(e){showToast('Ошибка микрофона');callActive=false;}
    }
    function toggleMic(){if(localAudioTrack){localAudioTrack.enabled=!localAudioTrack.enabled;$('#btnToggleMic').classList.toggle('active',!localAudioTrack.enabled);}}
    function endCall(){if(callStream){callStream.getTracks().forEach(t=>t.stop());}callActive=false;$('#callOverlay').classList.add('hidden');}

    // Админка
    function showAdminPanel(){
        const isMainAdmin=currentUser.isAdmin;
        const userList=users.map(u=>`<div>${u.avatar||'👤'} ${esc(u.name)} ${u.blocked?'🚫':''} <button class="btn small" onclick="toggleBlock('${u.id}')">${u.blocked?'Разблок':'Блок'}</button> ${isMainAdmin?`<button class="btn small" onclick="loginAs('${u.id}')">👁️ Войти</button>`:''} ${isMainAdmin?`<button class="btn small" onclick="grantAdmin('${u.id}')">⚡ Панель</button>`:''}</div>`).join('');
        $('#adminContent').innerHTML=`<h3>⚙️ Админ</h3>${userList}
            <h4>📨 Рассылка</h4><input id="broadcastText" placeholder="Текст"><button class="btn" onclick="broadcast()">Отправить в SashkaMessenger</button>
            <h4>📰 Новость</h4><input id="newsVersion" placeholder="Версия (V3.0)"><textarea id="newsText" placeholder="Текст новости"></textarea><button class="btn" onclick="addNews()">Опубликовать</button>
            <button class="btn ghost" onclick="$('#adminModal').classList.add('hidden')">Закрыть</button>`;
        $('#adminModal').classList.remove('hidden');
    }
    window.toggleBlock=(id)=>{const u=users.find(u=>u.id===id);if(u&&!u.isAdmin){u.blocked=!u.blocked;saveAll();showToast(u.blocked?'Заблокирован':'Разблокирован');showAdminPanel();}};
    window.loginAs=(id)=>{const u=users.find(u=>u.id===id);if(u){currentUser=u;saveAll();renderAll();$('#adminModal').classList.add('hidden');showToast('Вошли как '+u.name);}};
    window.grantAdmin=(id)=>{
        const days=prompt('Ограничение (дней, 0=навсегда):');
        adminGrants[id]={grantedBy:currentUser.id,expires:days>0?Date.now()+days*86400000:0};
        saveAll();showToast('Панель выдана');
    };
    window.broadcast=()=>{const t=$('#broadcastText').value.trim();if(t){if(!allMessages[SYSTEM_CHAT_ID])allMessages[SYSTEM_CHAT_ID]=[];allMessages[SYSTEM_CHAT_ID].push({id:guid(),from:'SashkaMessenger',fromId:'system',text:t,time:Date.now(),system:true});saveAll();renderAll();showToast('Рассылка отправлена');}};
    window.addNews=()=>{
        const v=$('#newsVersion').value.trim(),t=$('#newsText').value.trim();
        if(v&&t){newsData.unshift({version:v,text:t,author:currentUser.name,time:Date.now()});saveAll();showToast('Новость опубликована');showAdminPanel();}
    };

    // Новости
    function showNews(){
        $('#newsContent').innerHTML=`<h3>📰 Новости</h3>${newsData.length?newsData.map(n=>`<div style="margin-bottom:12px;"><b>${esc(n.version)}</b> <small>от ${esc(n.author)}</small><p>${esc(n.text)}</p></div>`).join(''):'<p>Нет новостей</p>'}<button class="btn ghost" onclick="$('#newsModal').classList.add('hidden')">Закрыть</button>`;
        $('#newsModal').classList.remove('hidden');
    }

    // Обработчики
    $('#btnLogin').onclick=async()=>{
        const n=$('#loginName').value.trim(),p=$('#loginPass').value;if(!n||!p)return;
        const h=await sha256(p);let u=users.find(u=>u.name===n&&u.passwordHash===h);
        if(!u){if(users.find(u=>u.name===n))return showToast('Имя занято');u={id:'user_'+Date.now(),name:n,passwordHash:h,description:$('#loginDesc').value.trim()||'',blocked:false,isAdmin:false,allowDM:true};users.push(u);}
        else if(u.blocked)return showToast('Аккаунт заблокирован');
        currentUser=u;saveAll();$('#loginModal').classList.add('hidden');renderAll();showToast('Добро пожаловать!');
    };
    $('#btnSend').onclick=()=>{const t=$('#msgInput').value.trim();if(t){sendMessage(t);$('#msgInput').value='';}};
    $('#msgInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#btnSend').click();}};
    $('#btnReload').onclick=()=>{renderMessages();renderChatList();showToast('Чат обновлён');};
    $('#btnRefreshApp').onclick=()=>{location.reload();};
    $('#btnNewChat').onclick=()=>{
        $('#createChatContent').innerHTML=`<h3>➕ Создать</h3><select id="chatType"><option value="private">Личное</option><option value="group">Группа</option><option value="channel">Канал</option></select><div id="chatFields"><input id="targetName" placeholder="Имя"></div><button class="btn" id="btnCreateChat">Создать</button><button class="btn ghost" id="btnCancelCreate">Отмена</button>`;
        $('#createChatModal').classList.remove('hidden');
        $('#chatType').onchange=function(){const t=this.value;$('#chatFields').innerHTML=t==='private'?'<input id="targetName" placeholder="Имя">':'<input id="chatName" placeholder="Название">'+(t==='group'?'<input type="password" id="chatPass" placeholder="Пароль">':'');};
        $('#btnCreateChat').onclick=async()=>{
            const t=$('#chatType').value;
            if(t==='private'){const n=$('#targetName').value.trim();const target=users.find(u=>u.name===n);if(!target)return showToast('Не найден');const cid='priv_'+[currentUser.id,target.id].sort().join('_');if(!chats.find(c=>c.id===cid)){chats.push({id:cid,type:'private',members:[currentUser.id,target.id]});allMessages[cid]=[];}currentChatId=cid;}
            else{const nm=$('#chatName').value.trim();const cid=(t==='group'?'group_':'channel_')+Date.now();chats.push({id:cid,type:t,name:nm,members:[currentUser.id],creatorId:currentUser.id,adminIds:[currentUser.id]});allMessages[cid]=[];currentChatId=cid;}
            saveAll();joinRoom(currentChatId);renderAll();$('#createChatModal').classList.add('hidden');
        };
        $('#btnCancelCreate').onclick=()=>$('#createChatModal').classList.add('hidden');
    };
    $('#btnDiscover').onclick=()=>{
        $('#discoverContent').innerHTML=`<h3>🔍 Поиск</h3><input id="discoverSearch" placeholder="Группы и каналы..."><div id="discoverResults"></div><button class="btn ghost" onclick="$('#discoverModal').classList.add('hidden')">Закрыть</button>`;
        $('#discoverModal').classList.remove('hidden');
        $('#discoverSearch').oninput=function(){const q=this.value.toLowerCase();const found=chats.filter(c=>(c.type==='group'||c.type==='channel')&&(c.name||'').toLowerCase().includes(q));$('#discoverResults').innerHTML=found.map(c=>`<div>${c.type==='group'?'👥':'📢'} ${esc(c.name)} <button class="btn small" onclick="joinFound('${c.id}','${c.type}')">Войти</button></div>`).join('');};
    };
    window.joinFound=(id,type)=>{const chat=chats.find(c=>c.id===id);if(!chat)return;if(type==='group'){const p=prompt('Пароль:');if(p){sha256(p).then(h=>{if(chat.passwordHash===h){chat.members.push(currentUser.id);currentChatId=id;saveAll();joinRoom(id);renderAll();$('#discoverModal').classList.add('hidden');}else showToast('Неверный пароль');});}}else{chat.members.push(currentUser.id);currentChatId=id;saveAll();joinRoom(id);renderAll();$('#discoverModal').classList.add('hidden');}};
    $('#btnProfile').onclick=()=>{
        if(!currentUser)return;
        $('#profileContent').innerHTML=`<h3>👤 Профиль</h3><div id="profAv" style="width:80px;height:80px;border-radius:50%;background-size:cover;margin:0 auto;${currentUser.avatar?'background-image:url('+currentUser.avatar+')':''}">${currentUser.avatar?'':'👤'}</div><input type="file" id="profAvFile" accept="image/*" style="display:none;"><p><b>${esc(currentUser.name)}</b></p><textarea id="profDesc">${esc(currentUser.description||'')}</textarea><input type="password" id="profPass" placeholder="Новый пароль"><label><input type="checkbox" id="profAllowDM" ${currentUser.allowDM!==false?'checked':''}> Разрешить ЛС</label><button class="btn" id="btnSaveProf">Сохранить</button><button class="btn ghost" id="btnLogout">🚪 Выйти</button>`;
        $('#profileModal').classList.remove('hidden');
        $('#profAv').onclick=()=>$('#profAvFile').click();$('#profAvFile').onchange=e=>{const f=e.target.files[0];if(f){const rd=new FileReader();rd.onload=ev=>{currentUser.avatar=ev.target.result;$('#profAv').style.backgroundImage='url('+ev.target.result+')';saveAll();};rd.readAsDataURL(f);}};
        $('#btnSaveProf').onclick=async()=>{currentUser.description=$('#profDesc').value.trim();currentUser.allowDM=$('#profAllowDM').checked;const np=$('#profPass').value;if(np)currentUser.passwordHash=await sha256(np);saveAll();$('#profileModal').classList.add('hidden');showToast('Профиль обновлён');};
        $('#btnLogout').onclick=()=>{leaveRoom();currentUser=null;currentChatId=null;saveAll();renderAll();$('#profileModal').classList.add('hidden');$('#loginModal').classList.remove('hidden');};
    };
    $('#btnAdmin').onclick=showAdminPanel;
    $('#btnNews').onclick=showNews;
    $('#btnBack').onclick=()=>{if(window.innerWidth<=768)$('#sidebar').classList.toggle('open');};
    $('#btnAttach').onclick=()=>$('#fileInput').click();
    $('#fileInput').onchange=()=>{const f=$('#fileInput').files[0];if(f){const rd=new FileReader();rd.onload=()=>sendMessage(null,rd.result);rd.readAsDataURL(f);$('#fileInput').value='';}};
    $('#btnVideoCircle').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:640},audio:true});videoStream=s;$('#videoPreview').srcObject=s;$('#videoModal').classList.remove('hidden');mediaRecorder=new MediaRecorder(s,{mimeType:'video/webm'});const chunks=[];mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});const rd=new FileReader();rd.onload=()=>sendMessage(null,rd.result);rd.readAsDataURL(b);s.getTracks().forEach(t=>t.stop());$('#videoModal').classList.add('hidden');};$('#btnStartVideo').onclick=()=>{mediaRecorder.start();$('#btnStartVideo').disabled=true;setTimeout(()=>{if(mediaRecorder.state==='recording')mediaRecorder.stop();},10000);};}catch(e){showToast('Ошибка камеры');}};
    $('#btnCancelVideo').onclick=()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop();if(videoStream)videoStream.getTracks().forEach(t=>t.stop());$('#videoModal').classList.add('hidden');};
    $('#btnCall').onclick=startCall;$('#btnToggleMic').onclick=toggleMic;$('#btnEndCall').onclick=endCall;
    $('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('light',theme==='light');saveAll();};
    $('#searchInput').oninput=()=>renderChatList($('#searchInput').value);
    $('#chatTabs').onclick=e=>{if(e.target.classList.contains('chat-tab')){document.querySelectorAll('.chat-tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');activeTab=e.target.dataset.filter;renderAll();}};
    document.querySelectorAll('.modal-overlay').forEach(m=>{m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};});

    initAdmin();
    document.body.classList.toggle('light',theme==='light');
    if(currentUser){$('#loginModal').classList.add('hidden');if(currentChatId)joinRoom(currentChatId);}
    else $('#loginModal').classList.remove('hidden');
    renderAll();
})();
</script>
</body>
</html>
