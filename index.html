<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sashka Messenger P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface2: #1e1e1e;
            --surface3: #282828;
            --text: #e8e8e8;
            --text2: #999;
            --accent: #5b9bd5;
            --accent2: #4a8ac4;
            --green: #4caf84;
            --red: #e0555a;
            --orange: #e8a84c;
            --purple: #9b59b6;
            --border: #2a2a2a;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 2px 20px rgba(0,0,0,0.6);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --sidebar-width: 320px;
        }
        .light {
            --bg: #f5f5f5;
            --surface: #fff;
            --surface2: #f0f0f0;
            --surface3: #e5e5e5;
            --text: #1a1a1a;
            --text2: #666;
            --border: #ddd;
            --shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: #000;
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            overflow: hidden;
            box-shadow: var(--shadow);
            background: var(--surface);
            position: relative;
        }
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
            z-index: 5;
            position: relative;
        }
        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-box {
            width: 100%;
            padding: 8px 12px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface3);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }
        .chat-tabs {
            display: flex;
            gap: 2px;
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            overflow-x: auto;
            flex-shrink: 0;
        }
        .chat-tab {
            padding: 5px 10px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .chat-tab.active { background: var(--accent); color: #fff; }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 6px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 1px;
        }
        .chat-item:hover { background: var(--surface2); }
        .chat-item.active { background: var(--accent); color: #fff; }
        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            background: var(--surface3);
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 600; font-size: 0.85rem; }
        .chat-preview { font-size: 0.7rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 8px; font-size: 0.6rem; font-weight: 700; margin-left: 3px; }
        .badge.creator { background: var(--purple); color: #fff; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            min-width: 0;
        }
        .main-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            flex-shrink: 0;
        }
        .back-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: var(--surface2); color: var(--text); cursor: pointer;
            font-size: 1rem; display: none; align-items: center; justify-content: center;
        }
        .main-header-info { flex: 1; min-width: 0; }
        .main-header-info .name { font-weight: 700; font-size: 0.9rem; }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            line-height: 1.3;
            animation: msgIn 0.2s ease-out;
            word-break: break-word;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.sent { align-self: flex-end; background: var(--accent); color: #fff; }
        .msg.received { align-self: flex-start; background: var(--surface2); }
        .msg.system { align-self: center; background: var(--surface3); color: var(--text2); font-size: 0.7rem; max-width: 90%; text-align: center; border-radius: 10px; padding: 5px 10px; }
        .msg .msg-sender { font-weight: 700; font-size: 0.7rem; margin-bottom: 2px; }
        .msg img.msg-image { max-width: 200px; border-radius: 8px; margin-top: 4px; cursor: pointer; }
        .msg video.msg-video-circle { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; margin-top: 4px; cursor: pointer; background: #000; }
        .msg a.msg-file { display: inline-block; padding: 8px 12px; background: var(--surface3); border-radius: 8px; color: var(--accent); text-decoration: none; margin-top: 4px; }
        .msg a.msg-file:hover { background: var(--accent); color: #fff; }
        .input-area {
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
            background: var(--surface);
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1; resize: none; border-radius: 18px;
            border: 1px solid var(--border); background: var(--surface2);
            color: var(--text); padding: 8px 12px; font-size: 0.85rem;
            outline: none; max-height: 80px; font-family: var(--font);
        }
        .send-btn, .reload-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 1rem; display: flex;
            align-items: center; justify-content: center;
        }
        .send-btn { background: var(--accent); color: #fff; }
        .reload-btn { background: var(--surface2); color: var(--text); }
        .icon-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: var(--surface2); color: var(--text); cursor: pointer;
            font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        .modal {
            background: var(--surface); border-radius: var(--radius);
            padding: 20px; width: 90%; max-width: 450px; max-height: 85vh;
            overflow-y: auto; box-shadow: var(--shadow);
        }
        .modal input, .modal textarea, .modal select {
            width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--surface2);
            color: var(--text); font-size: 0.85rem; margin-bottom: 8px;
            outline: none; font-family: var(--font);
        }
        .btn {
            padding: 8px 16px; border-radius: var(--radius-sm); border: none;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            background: var(--accent); color: #fff;
        }
        .btn.ghost { background: var(--surface2); color: var(--text); }
        .btn.danger { background: var(--red); }
        .hidden { display: none !important; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 8px 16px; border-radius: 16px;
            font-size: 0.8rem; z-index: 200; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(15px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* АДАПТАЦИЯ ПОД ТЕЛЕФОН */
        @media (max-width: 768px) {
            :root { --sidebar-width: 100%; }
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 100%;
                max-width: 100%;
                z-index: 10;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .back-btn { display: flex; }
            .main-header { padding: 6px 8px; gap: 4px; }
            .main-header-info .name { font-size: 0.8rem; }
            .messages-area { padding: 6px; gap: 2px; }
            .msg { max-width: 90%; font-size: 0.8rem; padding: 6px 10px; }
            .msg img.msg-image { max-width: 120px; }
            .msg video.msg-video-circle { width: 120px; height: 120px; }
            .input-area { padding: 6px; gap: 4px; }
            .input-area textarea { font-size: 0.8rem; padding: 6px 10px; }
            .send-btn, .reload-btn { width: 32px; height: 32px; font-size: 0.9rem; }
            .icon-btn { width: 28px; height: 28px; font-size: 0.8rem; }
            .chat-avatar { width: 32px; height: 32px; font-size: 0.9rem; }
            .chat-item { padding: 6px 8px; }
            .chat-name { font-size: 0.8rem; }
            .chat-preview { font-size: 0.65rem; }
            .modal { width: 95%; padding: 14px; }
            .modal input, .modal textarea, .modal select { font-size: 0.8rem; padding: 6px 10px; }
            .btn { font-size: 0.8rem; padding: 6px 12px; }
            .sidebar-header { padding: 8px; }
            .sidebar-header h2 { font-size: 1rem; }
            .search-box { font-size: 0.8rem; padding: 6px 10px; }
            .chat-tab { font-size: 0.65rem; padding: 4px 8px; }
            .toast { font-size: 0.7rem; padding: 6px 12px; bottom: 10px; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>💬 Sashka Messenger</h2>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск...">
        </div>
        <div class="chat-tabs" id="chatTabs">
            <button class="chat-tab active" data-filter="all">Все</button>
            <button class="chat-tab" data-filter="private">Личные</button>
            <button class="chat-tab" data-filter="group">Группы</button>
            <button class="chat-tab" data-filter="channel">Каналы</button>
            <button class="chat-tab" data-filter="system">Системные</button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div style="padding:6px;border-top:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;">
            <button class="icon-btn" id="btnNewChat" title="Создать">➕</button>
            <button class="icon-btn" id="btnDiscover" title="Найти">🔍</button>
            <button class="icon-btn" id="btnProfile" title="Профиль">👤</button>
            <button class="icon-btn" id="btnAdmin" title="Админ" style="display:none;">⚙️</button>
            <button class="icon-btn" id="btnTheme">🌓</button>
        </div>
    </div>
    <div class="main" id="mainPanel">
        <div class="main-header">
            <button class="back-btn" id="btnBack">←</button>
            <div class="chat-avatar" id="mainAvatar" style="width:36px;height:36px;font-size:0.9rem;">💬</div>
            <div class="main-header-info"><div class="name" id="mainName">Выберите чат</div></div>
            <div style="display:flex;gap:4px;">
                <button class="icon-btn" id="btnCall" title="Звонок" style="display:none;">📞</button>
                <button class="icon-btn" id="btnAttach" title="Файл">📎</button>
                <button class="icon-btn" id="btnVideoCircle">📹</button>
            </div>
        </div>
        <div class="messages-area" id="messagesArea">
            <div style="text-align:center;color:var(--text2);margin-top:40px;"><div style="font-size:3rem;">💬</div><p>Выберите чат</p></div>
        </div>
        <div class="input-area" id="inputArea" style="display:none;">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button class="send-btn" id="btnSend">➤</button>
            <button class="reload-btn" id="btnReload" title="Обновить чат">🔄</button>
        </div>
    </div>
</div>

<div class="modal-overlay hidden" id="loginModal"><div class="modal"><h3>🔐 Вход</h3><input type="text" id="loginName" placeholder="Логин"><input type="password" id="loginPass" placeholder="Пароль"><input type="text" id="loginDesc" placeholder="Описание (необязательно)"><button class="btn" id="btnLogin">Войти / Зарегистрироваться</button></div></div>
<div class="modal-overlay hidden" id="createChatModal"><div class="modal" id="createChatContent"></div></div>
<div class="modal-overlay hidden" id="profileModal"><div class="modal" id="profileContent"></div></div>
<div class="modal-overlay hidden" id="adminModal"><div class="modal" id="adminContent"></div></div>
<div class="modal-overlay hidden" id="discoverModal"><div class="modal" id="discoverContent"></div></div>
<div class="modal-overlay hidden" id="chatInfoModal"><div class="modal" id="chatInfoContent"></div></div>
<div class="modal-overlay hidden" id="videoModal"><div class="modal" style="text-align:center;"><h3>🎥 Видеокружок</h3><video id="videoPreview" autoplay muted style="width:200px;height:200px;border-radius:50%;object-fit:cover;background:#000;margin:0 auto;"></video><div style="display:flex;gap:8px;justify-content:center;margin-top:10px;"><button class="btn" id="btnStartVideo">🔴 Запись</button><button class="btn ghost" id="btnStopVideo" disabled>⏹️ Стоп</button><button class="btn ghost" id="btnCancelVideo">Отмена</button></div></div></div>
<div class="modal-overlay hidden" id="confirmModal"><div class="modal confirm-dialog" id="confirmContent"></div></div>

<div class="call-overlay hidden" id="callOverlay">
    <div class="call-video-container" id="callVideos"></div>
    <div style="font-size:1.2rem;font-weight:600;" id="callStatus">Звонок...</div>
    <div class="call-controls">
        <button class="call-btn mute" id="btnToggleMic">🎤</button>
        <button class="call-btn mute" id="btnToggleVideo">📹</button>
        <button class="call-btn mute" id="btnShareScreen">🖥️</button>
        <button class="call-btn decline" id="btnEndCall">📴</button>
    </div>
</div>

<input type="file" id="fileInput" accept="*" style="display:none;">
<div class="toast hidden" id="toast"></div>
<div class="context-menu hidden" id="contextMenu"></div>

<script>
(function() {
    const LS = 'sm32_';
    function LS_get(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d;}catch(e){return d;}}
    function LS_set(k,v){localStorage.setItem(LS+k,JSON.stringify(v));}
    async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
    function encryptText(t,k){if(!t||!k)return t;try{let r='';for(let i=0;i<t.length;i++)r+=String.fromCharCode(t.charCodeAt(i)^k.charCodeAt(i%k.length));return btoa(unescape(encodeURIComponent(r)));}catch(e){return t;}}
    function guid(){return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
    function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
    function gt(ts){return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
    const $=s=>document.querySelector(s);

    let users=LS_get('users',[]);
    let chats=LS_get('chats',[]);
    let allMessages=LS_get('messages',{});
    let allComments=LS_get('comments',{});
    let currentUser=LS_get('currentUser',null);
    let currentChatId=LS_get('currentChatId',null);
    let theme=LS_get('theme','dark');
    const SYSTEM_CHAT_ID='__system__';
    const SUGGEST_CHAT_ID='__suggest__';
    const ADMIN_NAME='sashka1999in2359';
    const ADMIN_PASS='Master_302';
    let peer=null, connections={};
    let activeTab='all';
    let mediaRecorder=null, videoStream=null;

    function sendMessageP2P(msg) {
        if (!currentChatId) return;
        const chat = chats.find(c => c.id === currentChatId);
        if (!chat?.members) return;
        chat.members.forEach(memberId => {
            if (memberId === currentUser.id) return;
            const targetPeerId = 'sm32_' + currentChatId + '_' + memberId;
            if (connections[targetPeerId] && connections[targetPeerId].open) {
                connections[targetPeerId].send({ type: 'message', chatId: currentChatId, msg });
            } else if (peer && !connections[targetPeerId]) {
                try {
                    const conn = peer.connect(targetPeerId, { reliable: true });
                    conn.on('open', () => {
                        connections[targetPeerId] = conn;
                        conn.send({ type: 'message', chatId: currentChatId, msg });
                        conn.on('data', handleData);
                        conn.on('close', () => delete connections[targetPeerId]);
                    });
                } catch(e) {}
            }
        });
    }

    function broadcast(data) {
        Object.values(connections).forEach(c => { if (c.open) try { c.send(data); } catch(e) {} });
    }

    function joinRoom(chatId) {
        if (!currentUser || !chatId) return;
        if (peer) { peer.destroy(); peer = null; }
        connections = {};
        const peerId = 'sm32_' + chatId + '_' + currentUser.id;
        try {
            peer = new Peer(peerId, { host: '0.peerjs.com', port: 443, secure: true, debug: 0 });
            peer.on('open', () => setTimeout(() => autoConnect(chatId), 1500));
            peer.on('connection', conn => {
                conn.on('open', () => {
                    connections[conn.peer] = conn;
                    saveKnownPeer(chatId, conn.peer);
                    conn.on('data', handleData);
                    conn.on('close', () => delete connections[conn.peer]);
                });
            });
            peer.on('error', () => {});
        } catch(e) {}
    }

    function autoConnect(chatId) {
        const known = JSON.parse(localStorage.getItem(LS + 'known') || '{}');
        if (known[chatId]) {
            known[chatId].forEach(pid => {
                if (!connections[pid] && pid !== peer?.id && peer) {
                    try {
                        const c = peer.connect(pid, { reliable: true });
                        c.on('open', () => {
                            connections[c.peer] = c;
                            saveKnownPeer(chatId, c.peer);
                            c.on('data', handleData);
                            c.on('close', () => delete connections[c.peer]);
                        });
                    } catch(e) {}
                }
            });
        }
    }

    function handleData(data) {
        if (data.type === 'message' && data.chatId === currentChatId) {
            if (!allMessages[currentChatId]) allMessages[currentChatId] = [];
            if (!allMessages[currentChatId].some(m => m.id === data.msg.id)) {
                allMessages[currentChatId].push(data.msg);
                saveAll();
                renderMessages();
                renderChatList();
            }
        }
    }

    function saveKnownPeer(chatId, peerId) {
        const known = JSON.parse(localStorage.getItem(LS + 'known') || '{}');
        if (!known[chatId]) known[chatId] = [];
        if (!known[chatId].includes(peerId)) {
            known[chatId].push(peerId);
            localStorage.setItem(LS + 'known', JSON.stringify(known));
        }
    }

    function leaveRoom() { if (peer) { peer.destroy(); peer = null; } connections = {}; }
    function saveAll(){LS_set('users',users);LS_set('chats',chats);LS_set('messages',allMessages);LS_set('comments',allComments);LS_set('currentUser',currentUser);LS_set('currentChatId',currentChatId);LS_set('theme',theme);}

    async function initAdmin(){
        const h=await sha256(ADMIN_PASS);
        let a=users.find(u=>u.name===ADMIN_NAME);
        if(!a){a={id:'admin_0',name:ADMIN_NAME,passwordHash:h,avatar:null,description:'Главный администратор',blocked:false,isAdmin:true,online:false,allowDM:false};users.unshift(a);}
        else{a.passwordHash=a.passwordHash||h;a.allowDM=false;a.isAdmin=true;}
        if(!chats.find(c=>c.id===SYSTEM_CHAT_ID)){chats.push({id:SYSTEM_CHAT_ID,type:'system',name:'SashkaMessenger',members:[],creatorId:'admin_0',adminIds:['admin_0']});allMessages[SYSTEM_CHAT_ID]=[];}
        if(!chats.find(c=>c.id===SUGGEST_CHAT_ID)){chats.push({id:SUGGEST_CHAT_ID,type:'suggest',name:'Предложка SashkaMessenger',members:[],creatorId:'admin_0',adminIds:['admin_0']});allMessages[SUGGEST_CHAT_ID]=[];}
        saveAll();
    }

    function getChatName(chat){if(!chat)return'';if(chat.type==='system')return'SashkaMessenger';if(chat.type==='suggest')return'Предложка';if(chat.type==='private'){const p=chat.members.find(m=>m!==currentUser?.id);const u=users.find(u=>u.id===p);return u?u.name:'Неизвестный';}return chat.name||'Без названия';}
    function getChatAvatar(chat){if(!chat)return null;if(chat.avatar)return chat.avatar;if(chat.type==='private'&&currentUser){const p=chat.members.find(m=>m!==currentUser?.id);const u=users.find(u=>u.id===p);return u?u.avatar:null;}return null;}
    function getChatEmoji(chat){if(!chat)return'💬';if(getChatAvatar(chat))return'';if(chat.type==='system')return'📋';if(chat.type==='suggest')return'💡';if(chat.type==='private')return'💬';if(chat.type==='group')return'👥';if(chat.type==='channel')return'📢';return'💬';}
    function isAdmin(chat){return chat&&currentUser&&(chat.adminIds?.includes(currentUser.id)||chat.creatorId===currentUser.id);}
    function isCreator(chat){return chat&&currentUser&&chat.creatorId===currentUser.id;}
    function canSend(chat){if(!chat||!currentUser)return false;if(chat.bannedUsers?.includes(currentUser.id))return false;if(chat.type==='channel')return isAdmin(chat);if(chat.type==='system')return currentUser.isAdmin;return true;}

    function renderAll(){renderChatList($('#searchInput').value||'');renderMessages();if(currentUser){$('#btnAdmin').style.display=currentUser.isAdmin?'flex':'none';}}

    function renderChatList(filter=''){
        const c=$('#chatList');if(!currentUser){c.innerHTML='';return;}
        let my=chats.filter(ch=>ch.type==='system'||ch.type==='suggest'||(ch.members&&ch.members.includes(currentUser.id)));
        if(activeTab!=='all')my=my.filter(ch=>ch.type===activeTab);
        const f=filter.toLowerCase();if(f)my=my.filter(ch=>getChatName(ch).toLowerCase().includes(f));
        my.sort((a,b)=>{const ma=allMessages[a.id]||[],mb=allMessages[b.id]||[];return(mb.length?mb[mb.length-1].time:0)-(ma.length?ma[ma.length-1].time:0);});
        c.innerHTML=my.map(ch=>{
            const nm=getChatName(ch),av=getChatAvatar(ch),em=getChatEmoji(ch),msgs=allMessages[ch.id]||[];
            let prev=null;if(ch.type==='suggest'&&!currentUser.isAdmin)prev=msgs.filter(m=>m.fromId===currentUser.id||m.system).slice(-1)[0];else prev=msgs.slice(-1)[0];
            const ptext=prev?(prev.file?'📎 Файл':prev.videoBlob?'🎥 Видеокружок':prev.text||''):'Нет сообщений';
            return`<div class="chat-item${ch.id===currentChatId?' active':''}" data-chat-id="${ch.id}"><div class="chat-avatar" style="${av?'background-image:url('+av+')':''}">${av?'':em}</div><div class="chat-info"><div class="chat-name">${esc(nm)}${isCreator(ch)?' <span class="badge creator">Создатель</span>':''}</div><div class="chat-preview">${esc(ptext)}</div></div></div>`;
        }).join('');
        c.querySelectorAll('.chat-item').forEach(el=>{el.onclick=()=>{const cid=el.dataset.chatId;if(cid!==currentChatId){leaveRoom();currentChatId=cid;saveAll();joinRoom(cid);renderAll();if(window.innerWidth<=768)$('#sidebar').classList.remove('open');}};});
    }

    function renderMessages(){
        const a=$('#messagesArea');
        if(!currentChatId||!currentUser){a.innerHTML='<div style="text-align:center;color:var(--text2);margin-top:40px;"><div style="font-size:3rem;">💬</div><p>Выберите чат</p></div>';$('#inputArea').style.display='none';$('#mainName').textContent='Выберите чат';$('#btnCall').style.display='none';return;}
        const chat=chats.find(c=>c.id===currentChatId);if(!chat){currentChatId=null;saveAll();renderAll();return;}
        $('#mainName').textContent=getChatName(chat);
        $('#inputArea').style.display=canSend(chat)?'flex':'none';
        $('#btnCall').style.display=(chat.type==='private'||chat.type==='group')?'flex':'none';
        let msgs=allMessages[currentChatId]||[];
        if(chat.type==='suggest'&&!currentUser.isAdmin)msgs=msgs.filter(m=>m.fromId===currentUser.id||m.system);
        a.innerHTML=msgs.map(m=>{
            const isMine=m.fromId===currentUser.id,cls=m.system?'system':(isMine?'sent':'received');
            let c='';if(m.text)c+='<div>'+esc(m.text)+'</div>';
            if(m.file){if(m.fileType&&m.fileType.startsWith('image/'))c+='<img src="'+m.file+'" class="msg-image">';else c+='<a href="'+m.file+'" class="msg-file">📎 '+esc(m.fileName||'Файл')+'</a>';}
            if(m.videoBlob)c+='<video src="'+m.videoBlob+'" class="msg-video-circle" controls></video>';
            return`<div class="msg ${cls}"><div class="msg-sender">${esc(m.from)}</div>${c}<div style="font-size:0.6rem;text-align:right;">${gt(m.time)}</div></div>`;
        }).join('');
        requestAnimationFrame(()=>{a.scrollTop=a.scrollHeight;});
    }

    function sendMessage(text,file,fileType,fileName,videoBlob){
        if(!currentChatId||!currentUser)return;
        const chat=chats.find(c=>c.id===currentChatId);if(!chat||!canSend(chat))return showToast('Нельзя писать');
        if(chat.type==='suggest'&&text){addSystemMessage(currentChatId,'Спасибо за предложение!');}
        const msg={id:guid(),from:currentUser.name,fromId:currentUser.id,text:text||'',file:file||null,fileType:fileType||null,fileName:fileName||null,videoBlob:videoBlob||null,time:Date.now(),system:false};
        if(!allMessages[currentChatId])allMessages[currentChatId]=[];
        allMessages[currentChatId].push(msg);
        saveAll();renderMessages();renderChatList();
        sendMessageP2P(msg);
    }

    function addSystemMessage(cid,text){if(!allMessages[cid])allMessages[cid]=[];allMessages[cid].push({id:guid(),from:'SashkaMessenger',fromId:'system',text,time:Date.now(),system:true});saveAll();}
    function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),2500);}

    async function createChat(type,name,password,memberNames=''){
        if(!currentUser)return;
        if(type==='private'){const target=users.find(u=>u.name===name);if(!target)return showToast('Пользователь не найден');const cid='priv_'+[currentUser.id,target.id].sort().join('_');chats.push({id:cid,type:'private',members:[currentUser.id,target.id]});allMessages[cid]=[];currentChatId=cid;}
        else if(type==='group'){const ph=await sha256(password);const cid='group_'+Date.now();chats.push({id:cid,type:'group',name,passwordHash:ph,members:[currentUser.id],creatorId:currentUser.id,adminIds:[currentUser.id]});allMessages[cid]=[];currentChatId=cid;}
        else if(type==='channel'){const cid='channel_'+Date.now();chats.push({id:cid,type:'channel',name,members:[currentUser.id],creatorId:currentUser.id,adminIds:[currentUser.id]});allMessages[cid]=[];currentChatId=cid;}
        saveAll();joinRoom(currentChatId);renderAll();showToast('Чат создан');
    }

    function showCreateChatModal(){
        $('#createChatContent').innerHTML=`<h3>➕ Создать чат</h3><select id="chatType"><option value="private">Личное</option><option value="group">Группа</option><option value="channel">Канал</option></select><div id="chatFields"></div><button class="btn" id="btnCreateChat">Создать</button><button class="btn ghost" id="btnCancelCreate">Отмена</button>`;
        $('#createChatModal').classList.remove('hidden');
        function upd(){const t=$('#chatType').value;$('#chatFields').innerHTML=t==='private'?'<input id="targetName" placeholder="Имя">':'<input id="chatName" placeholder="Название">'+(t==='group'?'<input type="password" id="chatPass" placeholder="Пароль">':'');}
        $('#chatType').onchange=upd;upd();
        $('#btnCreateChat').onclick=async()=>{const t=$('#chatType').value;if(t==='private')await createChat('private',$('#targetName').value.trim());else{const nm=$('#chatName').value.trim();if(t==='group')await createChat('group',nm,$('#chatPass').value);else await createChat('channel',nm);}$('#createChatModal').classList.add('hidden');};
        $('#btnCancelCreate').onclick=()=>$('#createChatModal').classList.add('hidden');
    }

    function showProfileModal(){
        if(!currentUser)return;
        $('#profileContent').innerHTML=`<h3>👤 Профиль</h3><p><b>Имя:</b> ${esc(currentUser.name)}</p><textarea id="profDesc">${esc(currentUser.description||'')}</textarea><input type="password" id="profPass" placeholder="Новый пароль"><button class="btn" id="btnSaveProf">Сохранить</button><button class="btn ghost" id="btnLogout">🚪 Выйти</button>`;
        $('#profileModal').classList.remove('hidden');
        $('#btnSaveProf').onclick=async()=>{currentUser.description=$('#profDesc').value.trim();const np=$('#profPass').value;if(np)currentUser.passwordHash=await sha256(np);saveAll();$('#profileModal').classList.add('hidden');showToast('Профиль обновлён');};
        $('#btnLogout').onclick=()=>{leaveRoom();currentUser=null;currentChatId=null;saveAll();renderAll();$('#profileModal').classList.add('hidden');$('#loginModal').classList.remove('hidden');};
    }

    function showAdminPanel(){
        if(!currentUser?.isAdmin)return;
        $('#adminContent').innerHTML=`<h3>⚙️ Админ</h3><input id="broadcastText" placeholder="Рассылка"><button class="btn" id="btnBroadcast">📨 Отправить</button>`;
        $('#adminModal').classList.remove('hidden');
        $('#btnBroadcast').onclick=()=>{const t=$('#broadcastText').value.trim();if(t){addSystemMessage(SYSTEM_CHAT_ID,t);renderAll();$('#adminModal').classList.add('hidden');}};
    }

    async function init(){
        await initAdmin();document.body.classList.toggle('light',theme==='light');
        if(currentUser){const u=users.find(u=>u.id===currentUser.id);if(u){currentUser=u;if(currentUser.blocked){currentUser=null;currentChatId=null;}}saveAll();}
        if(currentUser){$('#loginModal').classList.add('hidden');if(currentChatId)joinRoom(currentChatId);}else $('#loginModal').classList.remove('hidden');
        renderAll();
    }

    $('#btnLogin').onclick=async()=>{
        const n=$('#loginName').value.trim(),p=$('#loginPass').value;if(!n||!p)return showToast('Введите данные');
        const h=await sha256(p);let u=users.find(u=>u.name===n&&u.passwordHash===h);
        if(!u){if(users.find(u=>u.name===n))return showToast('Имя занято');u={id:'user_'+Date.now(),name:n,passwordHash:h,description:$('#loginDesc').value.trim()||'',blocked:false,isAdmin:false,allowDM:true};users.push(u);}
        else if(u.blocked)return showToast('Заблокированы');
        currentUser=u;saveAll();$('#loginModal').classList.add('hidden');renderAll();showToast('Добро пожаловать!');
    };

    $('#btnSend').onclick=()=>{const t=$('#msgInput').value.trim();if(t){sendMessage(t);$('#msgInput').value='';}};
    $('#msgInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#btnSend').click();}};
    $('#btnReload').onclick=()=>{if(currentChatId){renderMessages();renderChatList();showToast('Чат обновлён');}};
    $('#btnNewChat').onclick=showCreateChatModal;
    $('#btnProfile').onclick=showProfileModal;
    $('#btnAdmin').onclick=showAdminPanel;
    $('#btnBack').onclick=()=>{if(window.innerWidth<=768)$('#sidebar').classList.toggle('open');};
    $('#btnAttach').onclick=()=>$('#fileInput').click();
    $('#fileInput').onchange=()=>{const f=$('#fileInput').files[0];if(f){const rd=new FileReader();rd.onload=()=>sendMessage(null,rd.result,f.type,f.name);rd.readAsDataURL(f);$('#fileInput').value='';}};
    $('#btnVideoCircle').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:640},audio:true});videoStream=s;$('#videoPreview').srcObject=s;$('#videoModal').classList.remove('hidden');mediaRecorder=new MediaRecorder(s);const chunks=[];mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{const b=new Blob(chunks);const rd=new FileReader();rd.onload=()=>sendMessage(null,null,null,null,rd.result);rd.readAsDataURL(b);s.getTracks().forEach(t=>t.stop());$('#videoModal').classList.add('hidden');};$('#btnStartVideo').disabled=false;$('#btnStopVideo').disabled=true;}catch(e){showToast('Ошибка камеры');}};
    $('#btnStartVideo').onclick=()=>{if(mediaRecorder?.state==='inactive'){mediaRecorder.start();$('#btnStartVideo').disabled=true;$('#btnStopVideo').disabled=false;setTimeout(()=>{if(mediaRecorder?.state==='recording')$('#btnStopVideo').click();},10000);}};
    $('#btnStopVideo').onclick=()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop();};
    $('#btnCancelVideo').onclick=()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop();if(videoStream)videoStream.getTracks().forEach(t=>t.stop());$('#videoModal').classList.add('hidden');};
    $('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('light',theme==='light');saveAll();};
    $('#searchInput').oninput=()=>renderChatList($('#searchInput').value);
    $('#chatTabs').onclick=e=>{if(e.target.classList.contains('chat-tab')){document.querySelectorAll('.chat-tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');activeTab=e.target.dataset.filter;renderChatList($('#searchInput').value);}};
    document.querySelectorAll('.modal-overlay').forEach(m=>{m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};});

    init();
    console.log('🚀 Sashka Messenger P2P - Адаптирован!');
})();
</script>
</body>
</html>
